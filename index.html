<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>ServeYourSpace — Your Space. Your Services. Your Way.</title>
    <meta name="description" content="ServeYourSpace (SYS) is a mobile services marketplace connecting customers with trusted service providers, with ServiBot, its AI assistant." />
    <meta name="theme-color" content="#0b0712" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ServeYourSpace — Your Space. Your Services. Your Way." />
    <meta property="og:description" content="Discover a smarter way to connect with professionals and manage everyday services." />
    <meta property="og:image" content="/og-image.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@700&family=Caveat:wght@600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      // Apply saved theme + language before first paint (no flash).
      (function () {
        try {
          var t = localStorage.getItem('sys-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.style.colorScheme = t;
          var l = localStorage.getItem('sys-lang');
          if (l === 'en' || l === 'fr' || l === 'ar') {
            document.documentElement.lang = l;
            document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <noscript>ServeYourSpace — please enable JavaScript to view this website.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
